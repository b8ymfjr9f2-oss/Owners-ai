<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owners AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0b0b0f;
  color:white;
  font-family:Arial,sans-serif;
  height:100vh;
}

.app{
  max-width:600px;
  margin:auto;
  height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  padding:20px;
  text-align:center;
  border-bottom:1px solid #292930;
}

header h1{
  margin:0;
  font-size:25px;
}

header p{
  margin:6px 0 0;
  color:#999;
}

#chat{
  flex:1;
  overflow:auto;
  padding:20px;
}

.msg{
  padding:13px 16px;
  margin:10px 0;
  border-radius:16px;
  max-width:85%;
  line-height:1.4;
  white-space:pre-wrap;
}

.bot{
  background:#202027;
}

.user{
  background:#3157d5;
  margin-left:auto;
}

.input{
  display:flex;
  gap:8px;
  padding:12px;
  border-top:1px solid #292930;
}

input{
  flex:1;
  background:#19191f;
  color:white;
  border:1px solid #333;
  border-radius:25px;
  padding:14px;
  font-size:16px;
  outline:none;
}

button{
  border:0;
  border-radius:50%;
  width:48px;
  height:48px;
  background:#3157d5;
  color:white;
  font-size:20px;
}
</style>
</head>

<body>

<div class="app">

<header>
<h1>🤖 Owners AI</h1>
<p>Your personal AI assistant</p>
</header>

<div id="chat">
<div class="msg bot">
Hello! 👋<br>
I am Owners AI.<br>
How can I help you?
</div>
</div>

<div class="input">
<input
id="text"
placeholder="Ask Owners AI..."
onkeydown="if(event.key==='Enter') send()">

<button onclick="send()">➤</button>
</div>

</div>

<script>

const API_URL =
"https://onwers-ai.h9v49c4njk.workers.dev/";

async function send(){

const input=document.getElementById("text");
const text=input.value.trim();

if(!text)return;

const chat=document.getElementById("chat");

chat.innerHTML +=
`<div class="msg user">${escapeHtml(text)}</div>`;

input.value="";

const loading=document.createElement("div");
loading.className="msg bot";
loading.textContent="Thinking... 🤔";
chat.appendChild(loading);

chat.scrollTop=chat.scrollHeight;

try{

const response=await fetch(API_URL,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
messages:[
{
role:"system",
content:"You are Owners AI, a helpful personal AI assistant."
},
{
role:"user",
content:text
}
]
})
});

const data=await response.json();

loading.remove();

if(!response.ok){
throw new Error(data.error || "API error");
}

const reply =
data.choices?.[0]?.message?.content ||
"No response received.";

chat.innerHTML +=
`<div class="msg bot">${escapeHtml(reply)}</div>`;

}catch(error){

loading.remove();

chat.innerHTML +=
`<div class="msg bot">
Sorry, AI connection failed. 😕<br>
${escapeHtml(error.message)}
</div>`;

}

chat.scrollTop=chat.scrollHeight;

}

function escapeHtml(text){

return text.replace(/[&<>"']/g,function(m){

return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m];

});

}

</script>

</body>
</html>
